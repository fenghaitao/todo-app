<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <h1>My Tasks</h1>
                <button id="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light mode">🌙</button>
            </div>
            <p class="subtitle" id="task-count">0 tasks remaining</p>
        </header>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
            <button id="add-btn" aria-label="Add task">
                <span>+</span>
            </button>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" aria-label="Todo list"></ul>

        <footer class="list-footer" id="list-footer" hidden>
            <button id="clear-completed">Clear completed</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
